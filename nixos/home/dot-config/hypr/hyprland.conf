autogenerated = 0

$mainMod = SUPER
$terminal = ghostty
$menu = wofi --show drun

exec-once = ~/.config/hypr/scripts/start-bars.sh
exec-once = hypridle

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(8aadf4ee) rgba(c6a0f6ee) 45deg
    col.inactive_border = rgba(494d64aa)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.98
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = true

    bezier = macEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, macEase, popin 86%
    animation = windowsOut, 1, 4, macEase, popin 86%
    animation = border, 1, 6, default
    animation = fade, 1, 5, macEase
    animation = layers, 1, 5, macEase, slide
    animation = layersIn, 1, 5, macEase, slide
    animation = layersOut, 1, 4, macEase, slide
    animation = fadeLayers, 1, 4, macEase
    animation = workspaces, 1, 4, macEase, slide
}

dwindle {
    preserve_split = true
    smart_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.2

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}


bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, S, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; area="$(slurp)"; [ -n "$area" ] || exit 0; sleep 0.2; grim -g "$area" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png"'

bind = , F7, exec, playerctl position 0
bind = , F8, exec, playerctl play-pause
bind = , F9, exec, playerctl next
bind = , F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , F12, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

bindl = , XF86AudioPrev, exec, playerctl position 0
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
